name: Sync Steadfast Statuses

# Refreshes Steadfast delivery status for recent orders once a day and caches
# it in the steadfast_consignments table (status only — charges from the CSV
# import are preserved). Can also be run manually from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 12:00 noon BDT, daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily Steadfast status sync
        run: |
          echo "Calling sync-steadfast…"
          curl -fsS -m 600 \
            "https://dicanelropavoaqisebh.supabase.co/functions/v1/fetch-dashboard?mode=sync-steadfast&days=45" \
            -H "Authorization: Bearer sb_publishable_dO4YNs6kZZhzIKQQ2Q8UuQ_BLSe2OaW" \
            -H "apikey: sb_publishable_dO4YNs6kZZhzIKQQ2Q8UuQ_BLSe2OaW" \
            | tee /tmp/sync.json
          echo ""
          echo "Sync response above."
